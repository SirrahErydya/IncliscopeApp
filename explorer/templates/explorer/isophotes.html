{% load static %}
<script>
    $(function () {
        $(".latex").latex({ url: 'https://latex.codecogs.com/svg.image?{e}'});
    });
</script>
<div class="isophote-canvas">
    <img src="{{ galaxy.image }}"/>
    <canvas id="galaxy-canvas" width="512" height="512"></canvas>
</div>
<div class="inclination-label">
    <h1>Estimate the inclination <i>i</i> with Holmberg's axis-ratio-equation</h1>
    <div class="latex">
        \Large
        {\color{white}
            \cos{i} = \sqrt{\frac{(b/a)^2 - q_0^2}{1 - q_0^2}}
        }
    </div>
    <input type="range" id="q0" name="q0" min="0.1" max="0.5" step="0.01"/>
    <label for="q0">q0 = <output id="q0-value"></output></label><br/>
    <input type="range" id="width" name="width" min="1" max="255" step="1"/>
    <label for="width">Width = <output id="width-value"></output></label>
    <br/>
    <input type="range" id="height" name="height" min="1" max="255" step="1"/>
    <label for="height">Height = <output id="height-value">...</output>°</label>
    <br/>
    <p id="inclination">
        Inclination <i>i</i> = <output id="inclination-value"></output>°
        <span id="gt" style="display:none;">(True value: {{ galaxy.i_mean|floatformat:2 }}°)</span>
    </p>
    <button class="button" id="toggle-button">Show Ground Truth</button>
</div>

<script type="text/javascript" src="{% static 'explorer/ellipses.js' %}"></script>
<script type="text/javascript" src="{% static 'explorer/draw_isophotes.js' %}"></script>
